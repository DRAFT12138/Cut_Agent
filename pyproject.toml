[project]
name = "cut-agent"
dynamic = ["version"]
description = "Local video rough-cut planning workspace with editable timelines and finishing handoff"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
dependencies = [
    "langgraph",
    "openai",
    "playwright",
    "pillow",
    "requests",
    "beautifulsoup4",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "httpx>=0.28.1",
    "markdown-it-py[plugins]>=4",
    "pydantic>=2",
]

[project.scripts]
cut-agent = "cut_agent.cli:main"

[project.urls]
Homepage = "https://github.com/DRAFT12138/Cut_Agent"
Repository = "https://github.com/DRAFT12138/Cut_Agent"
Issues = "https://github.com/DRAFT12138/Cut_Agent/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "cut_agent.__version__"}

[tool.setuptools.package-data]
cut_agent = ["web_dist/**/*"]

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=9.1.1",
    "ruff>=0.13",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "media: requires real FFmpeg and FFprobe binaries",
]
